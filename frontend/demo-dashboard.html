<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Demo Portal — IMPLEXEDU</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg: #0b0f19;
      --surface: rgba(20, 26, 40, 0.7);
      --surface-hover: rgba(30, 38, 56, 0.8);
      --border: rgba(255, 255, 255, 0.08);
      --border-glow: rgba(99, 102, 241, 0.4);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      --success: #10b981;
      --warning: #f59e0b;
      --info: #3b82f6;
      --font-head: 'Outfit', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(99, 102, 241, 0.12), transparent 25%),
        radial-gradient(circle at 85% 30%, rgba(168, 85, 247, 0.12), transparent 25%);
      background-attachment: fixed;
      font-family: var(--font-body);
      color: var(--text);
      min-height: 100vh;
    }

    /* Navbar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 40px;
      background: rgba(11, 15, 25, 0.8);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: var(--font-head);
    }
    
    .brand-icon {
      background: var(--accent-gradient);
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: white;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
    }
    
    .brand h1 { font-size: 20px; font-weight: 800; letter-spacing: 0.5px; }

    .logout-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 20px;
      border-radius: 100px;
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logout-btn:hover { background: rgba(244, 63, 94, 0.15); border-color: rgba(244, 63, 94, 0.4); color: #fb7185; }

    .container { padding: 40px; max-width: 1400px; margin: 0 auto; }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(10px);
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
    }
    .stat-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.4);
      border-color: var(--border-glow);
    }
    
    .stat-icon {
      position: absolute;
      top: 24px;
      right: 24px;
      font-size: 28px;
      opacity: 0.15;
    }
    
    .stat-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }
    
    .stat-value {
      font-family: var(--font-head);
      font-size: 36px;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(to right, #fff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Card Themes */
    .card-total .stat-icon { color: var(--info); opacity: 0.3; }
    .card-pending .stat-icon { color: var(--warning); opacity: 0.3; }
    .card-contacted .stat-icon { color: var(--accent); opacity: 0.3; }
    .card-converted .stat-icon { color: var(--success); opacity: 0.3; }

    /* Table Section */
    .table-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 24px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    
    .table-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .table-header h2 {
      font-family: var(--font-head);
      font-size: 22px;
      font-weight: 700;
    }
    
    .table-container {
      overflow-x: auto;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.04);
    }

    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 18px 20px; border-bottom: 1px solid rgba(255,255,255,0.04); }
    th {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      font-weight: 700;
      background: rgba(0,0,0,0.2);
      white-space: nowrap;
    }
    td { font-size: 14px; font-weight: 500; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr { transition: background 0.2s; }
    tr:hover { background: rgba(255,255,255,0.03); }

    /* User Profile formatting in table */
    .user-info { display: flex; align-items: center; gap: 12px; }
    .user-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-family: var(--font-head); color: var(--accent); font-size: 14px;
    }
    .user-name { font-weight: 700; color: #fff; display: block; margin-bottom: 4px; }
    .user-class { font-size: 12px; color: var(--text-muted); }

    /* Badges */
    .badge {
      display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 100px;
      font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
    }
    .badge-Pending { background: rgba(245,158,11,0.15); color: #fbbf24; border: 1px solid rgba(245,158,11,0.2); }
    .badge-Contacted { background: rgba(99,102,241,0.15); color: #818cf8; border: 1px solid rgba(99,102,241,0.2); }
    .badge-Converted { background: rgba(16,185,129,0.15); color: #34d399; border: 1px solid rgba(16,185,129,0.2); }

    .medium-badge { background: rgba(255,255,255,0.08); padding: 4px 10px; border-radius: 6px; font-size: 12px; color: var(--text-muted); }

    /* Custom Select */
    .status-select {
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      font-family: var(--font-body);
      cursor: pointer;
      outline: none;
      transition: all 0.2s;
    }
    .status-select:hover { border-color: var(--accent); }
    .status-select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,0.2); }
    .status-select option { background: #1e293b; color: #fff; }

    /* Action Links */
    .wa-link {
      display: inline-flex; align-items: center; gap: 6px; color: #22c55e;
      text-decoration: none; font-weight: 600; background: rgba(34,197,94,0.1);
      padding: 6px 12px; border-radius: 8px; transition: all 0.2s;
    }
    .wa-link:hover { background: rgba(34,197,94,0.2); transform: scale(1.02); }

    .empty-state { text-align: center; padding: 80px 20px; }
    .empty-icon { font-size: 48px; color: var(--border); margin-bottom: 16px; }
    .empty-text { font-size: 16px; font-weight: 600; color: var(--text-muted); }

    /* Loading Pulse */
    .pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }

    /* =========================================
       MOBILE RESPONSIVENESS
       ========================================= */
    @media (max-width: 768px) {
      /* Adjust Container & Navbar padding */
      .navbar { padding: 12px 16px; }
      .container { padding: 16px; }
      
      /* Make brand title smaller and remove button text */
      .brand h1 { font-size: 16px; }
      .brand-icon { width: 30px; height: 30px; font-size: 14px; }
      .logout-text { display: none; }
      .logout-btn { padding: 8px 12px; }

      /* Stat Cards layout */
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        margin-bottom: 24px;
      }
      .stat-card { padding: 16px; border-radius: 16px; }
      .stat-icon { font-size: 20px; top: 16px; right: 16px; }
      .stat-value { font-size: 24px; }
      .stat-title { font-size: 10px; margin-bottom: 8px; }

      /* Table Section */
      .table-section { padding: 16px; border-radius: 16px; }
      .table-header { flex-direction: column; align-items: flex-start; gap: 8px; margin-bottom: 16px; }
      .table-header h2 { font-size: 18px; }
      
      th, td { padding: 12px 14px; font-size: 13px; }
      .user-avatar { width: 30px; height: 30px; font-size: 12px; }
    }

    @media (max-width: 480px) {
      /* Stack stats fully on very tiny screens */
      .stats-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="brand">
      <div class="brand-icon"><i class="fa-solid fa-graduation-cap"></i></div>
      <h1>Demo Command Center</h1>
    </div>
    <button class="logout-btn" onclick="logout()">
      <i class="fa-solid fa-arrow-right-from-bracket"></i> <span class="logout-text">Disconnect</span>
    </button>
  </nav>

  <div class="container">
    <!-- Statistics Cards -->
    <div class="stats-grid">
      <div class="stat-card card-total">
        <i class="fa-solid fa-users stat-icon"></i>
        <div class="stat-title">Total Applications</div>
        <div class="stat-value" id="statTotal">0</div>
      </div>
      <div class="stat-card card-pending">
        <i class="fa-solid fa-hourglass-half stat-icon"></i>
        <div class="stat-title">Pending Action</div>
        <div class="stat-value" id="statPending">0</div>
      </div>
      <div class="stat-card card-contacted">
        <i class="fa-solid fa-headset stat-icon"></i>
        <div class="stat-title">Currently Contacted</div>
        <div class="stat-value" id="statContacted">0</div>
      </div>
      <div class="stat-card card-converted">
        <i class="fa-solid fa-circle-check stat-icon"></i>
        <div class="stat-title">Successfully Converted</div>
        <div class="stat-value" id="statConverted">0</div>
      </div>
    </div>

    <!-- Data Table Section -->
    <div class="table-section">
      <div class="table-header">
        <h2>Recent Trial Applications</h2>
      </div>

      <div class="table-container">
        <table id="demoTable">
          <thead>
            <tr>
              <th>Applicant Details</th>
              <th>Contact Info</th>
              <th>WhatsApp</th>
              <th>Medium</th>
              <th>Current Status</th>
              <th>Update Action</th>
            </tr>
          </thead>
          <tbody id="demoBody">
            <tr>
              <td colspan="6" class="empty-state pulse">
                <i class="fa-solid fa-circle-notch fa-spin empty-icon"></i>
                <div class="empty-text">Syncing database records...</div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('demo_token');
    if (!token) {
      window.location.href = '/demo-login';
    }

    function calculateStats(data) {
      let total = data.length;
      let pending = 0;
      let contacted = 0;
      let converted = 0;

      data.forEach(req => {
        if (req.status === 'Pending') pending++;
        if (req.status === 'Contacted') contacted++;
        if (req.status === 'Converted') converted++;
      });

      // Animate numbers
      animateValue("statTotal", 0, total, 1000);
      animateValue("statPending", 0, pending, 1000);
      animateValue("statContacted", 0, contacted, 1000);
      animateValue("statConverted", 0, converted, 1000);
    }

    function animateValue(id, start, end, duration) {
      const obj = document.getElementById(id);
      if(!obj) return;
      if(start === end) {
        obj.innerHTML = end;
        return;
      }
      let startTimestamp = null;
      const step = (timestamp) => {
        if (!startTimestamp) startTimestamp = timestamp;
        const progress = Math.min((timestamp - startTimestamp) / duration, 1);
        obj.innerHTML = Math.floor(progress * (end - start) + start);
        if (progress < 1) {
          window.requestAnimationFrame(step);
        } else {
          obj.innerHTML = end;
        }
      };
      window.requestAnimationFrame(step);
    }

    function getInitials(name) {
      if(!name) return "S";
      return name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
    }

    async function loadDemoRequests() {
      const tbody = document.getElementById('demoBody');
      
      try {
        const res = await fetch('/api/trial', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();

        if (data.success) {
          calculateStats(data.data);
          
          if (data.data.length > 0) {
            tbody.innerHTML = '';
            data.data.forEach(req => {
              const tr = document.createElement('tr');
              
              const icon = req.status === 'Pending' ? 'fa-clock' : req.status === 'Contacted' ? 'fa-phone' : 'fa-check';

              tr.innerHTML = `
                <td>
                  <div class="user-info">
                    <div class="user-avatar">${getInitials(req.name)}</div>
                    <div>
                      <span class="user-name">${req.name}</span>
                      <span class="user-class">Class ${req.class}</span>
                    </div>
                  </div>
                </td>
                <td><div style="color:var(--text-muted); font-size:13px;"><i class="fa-solid fa-phone" style="font-size:10px; margin-right:6px;"></i>${req.mobile}</div></td>
                <td>
                  <a href="https://wa.me/91${req.whatsapp}" target="_blank" class="wa-link">
                    <i class="fa-brands fa-whatsapp"></i> ${req.whatsapp}
                  </a>
                </td>
                <td><span class="medium-badge">${req.medium}</span></td>
                <td>
                  <span class="badge badge-${req.status}">
                    <i class="fa-solid ${icon}"></i> ${req.status}
                  </span>
                </td>
                <td>
                  <select onchange="updateStatus('${req._id}', this.value)" class="status-select">
                    <option value="Pending" ${req.status === 'Pending' ? 'selected' : ''}>Pending</option>
                    <option value="Contacted" ${req.status === 'Contacted' ? 'selected' : ''}>Contacted</option>
                    <option value="Converted" ${req.status === 'Converted' ? 'selected' : ''}>Converted</option>
                  </select>
                </td>
              `;
              tbody.appendChild(tr);
            });
          } else {
            tbody.innerHTML = `
              <tr>
                <td colspan="6" class="empty-state">
                  <i class="fa-solid fa-inbox empty-icon"></i>
                  <div class="empty-text">No trial applications found yet.</div>
                </td>
              </tr>`;
          }
        }
      } catch (err) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" class="empty-state">
              <i class="fa-solid fa-triangle-exclamation empty-icon" style="color:#ef4444;"></i>
              <div class="empty-text">Failed to establish database connection.</div>
            </td>
          </tr>`;
      }
    }

    async function updateStatus(id, newStatus) {
      if(!confirm(`Update this application status to '${newStatus}'?`)) {
        return loadDemoRequests(); 
      }
      
      try {
        const res = await fetch(`/api/trial/${id}`, {
          method: 'PUT',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ status: newStatus })
        });
        
        if(res.ok) {
          loadDemoRequests(); // Reload to update stats and UI
        } else {
          alert("Unauthorized or failed to update.");
        }
      } catch(e) {
        alert("Network error.");
      }
    }

    function logout() {
      localStorage.removeItem('demo_token');
      window.location.href = '/demo-login';
    }

    // Initialize
    loadDemoRequests();
  </script>
<script src="theme.js"></script></body>
</html>
