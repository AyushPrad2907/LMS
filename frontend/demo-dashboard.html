<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo Applicants Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: var(--bg); font-family: var(--font-body); color: var(--text); margin: 0; padding: 0; }
    .navbar { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background: var(--surface); border-bottom: 1px solid var(--border); }
    .navbar h1 { font-family: var(--font-head); font-size: 22px; font-weight: 800; margin: 0; }
    .logout-btn { background: rgba(244,63,94,0.15); color: #f43f5e; border: 1px solid rgba(244,63,94,0.3); padding: 8px 20px; border-radius: 100px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
    .logout-btn:hover { background: rgba(244,63,94,0.25); }
    
    .container { padding: 40px; max-width: 1400px; margin: 0 auto; }
    .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    
    .table-container { background: var(--surface); border-radius: 16px; border: 1px solid var(--border); overflow: hidden; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 18px 24px; border-bottom: 1px solid var(--border); }
    th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); font-weight: 700; background: var(--surface2); }
    td { font-size: 14px; font-weight: 600; }
    tr:hover { background: rgba(255,255,255,0.02); }
    
    .status-badge { display: inline-flex; padding: 4px 12px; border-radius: 100px; font-size: 11px; font-weight: 700; }
    .status-Pending { background: rgba(245,166,35,0.15); color: #f5a623; }
    .status-Contacted { background: rgba(59,130,246,0.15); color: #60a5fa; }
    .status-Converted { background: rgba(34,197,94,0.15); color: #4ade80; }
    
    .action-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 8px 14px; border-radius: 8px; font-size: 12px; cursor: pointer; font-weight: 700; outline: none; }
    .action-btn:hover { border-color: var(--accent); color: var(--accent); }
    
    .empty-state { text-align: center; padding: 60px; color: var(--text-muted); font-weight: 600; }
  </style>
</head>
<body>

  <nav class="navbar">
    <h1>Demo Manager Portal</h1>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </nav>

  <div class="container">
    <div class="header-row">
      <h2>Recent Trial Applications</h2>
    </div>

    <div class="table-container">
      <table id="demoTable">
        <thead>
          <tr>
            <th>Name</th>
            <th>Mobile</th>
            <th>WhatsApp</th>
            <th>Class</th>
            <th>Medium</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="demoBody">
          <!-- Rows will be injected here -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('demo_token');
    if (!token) {
      window.location.href = '/demo-login';
    }

    async function loadDemoRequests() {
      const tbody = document.getElementById('demoBody');
      tbody.innerHTML = '<tr><td colspan="7" class="empty-state">Loading demo applications...</td></tr>';
      
      try {
        const res = await fetch('/api/trial', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();

        if (data.success && data.data.length > 0) {
          tbody.innerHTML = '';
          data.data.forEach(req => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td>${req.name}</td>
              <td>${req.mobile}</td>
              <td><a href="https://wa.me/91${req.whatsapp}" target="_blank" style="color:var(--accent); text-decoration:none;">${req.whatsapp}</a></td>
              <td>Class ${req.class}</td>
              <td>${req.medium}</td>
              <td><span class="status-badge status-${req.status}">${req.status}</span></td>
              <td>
                <select onchange="updateStatus('${req._id}', this.value)" class="action-btn">
                  <option value="Pending" ${req.status === 'Pending' ? 'selected' : ''}>Pending</option>
                  <option value="Contacted" ${req.status === 'Contacted' ? 'selected' : ''}>Contacted</option>
                  <option value="Converted" ${req.status === 'Converted' ? 'selected' : ''}>Converted</option>
                </select>
              </td>
            `;
            tbody.appendChild(tr);
          });
        } else {
          tbody.innerHTML = '<tr><td colspan="7" class="empty-state">No demo applications found.</td></tr>';
        }
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="7" class="empty-state">Error fetching data.</td></tr>';
      }
    }

    async function updateStatus(id, newStatus) {
      if(!confirm(`Mark this application as ${newStatus}?`)) {
        return loadDemoRequests(); // reset select element if cancelled
      }
      
      try {
        await fetch(`/api/trial/${id}`, {
          method: 'PUT',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ status: newStatus })
        });
        loadDemoRequests();
      } catch(e) {
        alert("Failed to update status");
      }
    }

    function logout() {
      localStorage.removeItem('demo_token');
      window.location.href = '/demo-login';
    }

    loadDemoRequests();
  </script>
</body>
</html>
