<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — IMPLEXEDU</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .logo-text { font-size: 20px; }

    .filter-bar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:24px; align-items:center; }
    .filter-chip { background:var(--surface2); border:1px solid var(--border); border-radius:100px; padding:6px 16px; font-size:12px; font-weight:600; color:var(--text-muted); cursor:pointer; transition:all 0.2s; white-space:nowrap; }
    .filter-chip:hover { border-color:rgba(108,99,255,0.4); color:var(--text); }
    .filter-chip.active { background:rgba(108,99,255,0.15); border-color:var(--accent); color:var(--text); }

    .req-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(360px,1fr)); gap:18px; }

    .req-card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:22px; position:relative; overflow:hidden; }
    .req-status-strip { position:absolute; top:0; left:0; right:0; height:3px; }
    .req-status-Pending  .req-status-strip { background:linear-gradient(90deg,#f5a623,#e8920f); }
    .req-status-Approved .req-status-strip { background:linear-gradient(90deg,#22c55e,#16a34a); }
    .req-status-Rejected .req-status-strip { background:linear-gradient(90deg,#f43f5e,#e11d48); }

    .req-top { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:14px; }
    .req-course { font-family:var(--font-head); font-size:16px; font-weight:800; margin-bottom:4px; }
    .req-meta { font-size:12px; color:var(--text-muted); }
    .req-fee { font-family:var(--font-head); font-size:18px; font-weight:800; color:var(--accent2); text-align:right; flex-shrink:0; }

    .status-badge { display:inline-flex; align-items:center; gap:6px; border-radius:100px; padding:4px 12px; font-size:11px; font-weight:700; }
    .status-Pending  { background:rgba(245,166,35,0.12); color:#f5a623; }
    .status-Approved { background:rgba(34,197,94,0.12);  color:#22c55e; }
    .status-Rejected { background:rgba(244,63,94,0.12);  color:#f43f5e; }

    .req-fields { display:grid; grid-template-columns:1fr 1fr; gap:10px 14px; margin:16px 0; }
    .req-field-label { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-muted); margin-bottom:2px; }
    .req-field-val { font-size:13px; font-weight:600; word-break:break-word; }

    .req-images { display:flex; gap:12px; margin:16px 0; }
    .req-img-box { flex:1; text-align:center; }
    .req-img-box img { width:100%; max-width:140px; height:100px; object-fit:cover; border-radius:8px; border:1px solid var(--border); cursor:zoom-in; background:var(--surface2); }
    .no-img-placeholder { display:inline-flex; align-items:center; justify-content:center; width:100%; max-width:140px; height:100px; background:var(--surface2); border:1px dashed var(--border); border-radius:8px; color:var(--text-muted); font-size:11px; font-weight:600; }
    .req-img-label { font-size:10px; color:var(--text-muted); margin-top:6px; text-transform:uppercase; letter-spacing:0.06em; font-weight:700; }

    .req-actions { display:flex; gap:8px; margin-top:16px; }
    .btn-approve, .btn-reject, .btn-ignore, .btn-undo {
      flex:1; border:none; border-radius:8px; padding:10px; font-family:var(--font-body);
      font-size:12px; font-weight:700; cursor:pointer; transition:all 0.2s;
    }
    .btn-approve { background:rgba(34,197,94,0.15); border:1px solid rgba(34,197,94,0.35); color:#4ade80; }
    .btn-approve:hover { background:rgba(34,197,94,0.28); }
    .btn-reject { background:rgba(244,63,94,0.15); border:1px solid rgba(244,63,94,0.35); color:#fb7185; }
    .btn-reject:hover { background:rgba(244,63,94,0.28); }
    .btn-ignore { background:var(--surface2); border:1px solid var(--border); color:var(--text-muted); }
    .btn-ignore:hover { color:var(--text); border-color:rgba(255,255,255,0.2); }
    .btn-undo { background:rgba(255,255,255,0.06); border:1px solid var(--border); color:var(--text); }
    .btn-undo:hover { background:rgba(255,255,255,0.12); border-color:rgba(255,255,255,0.3); }
    .req-actions button:disabled { opacity:0.5; cursor:not-allowed; }

    .empty-state { text-align:center; padding:60px 40px; color:var(--text-muted); grid-column:1/-1; }
    .empty-icon { font-size:56px; margin-bottom:16px; opacity:0.4; }
    .empty-title { font-family:var(--font-head); font-size:20px; font-weight:700; color:var(--text); margin-bottom:6px; }

    /* Lightbox for viewing full-size images */
    .lightbox { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:999; align-items:center; justify-content:center; padding:24px; cursor:zoom-out; }
    .lightbox.open { display:flex; }
    .lightbox img { max-width:90vw; max-height:90vh; border-radius:12px; }

    @media (max-width:640px) {
      .req-grid { grid-template-columns:1fr; }
      .req-fields { grid-template-columns:1fr; }

      /* Topbar adjustments */
      .topbar { padding: 12px 16px; flex-wrap: wrap; gap: 12px; }
      .topbar-right { width: 100%; justify-content: space-between; gap: 8px; }
      .user-name { display: none; } /* Hide text name on mobile, keep avatar initials */
      
      /* Page title layout */
      .page-header { flex-direction: column; align-items: flex-start !important; gap: 12px; width: 100%; }
      .page-header .filter-bar { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .page-header .filter-chip { text-align: center; justify-content: center; }
      
      /* Enrollment Status Filters */
      #enrollmentsView .filter-bar { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; width: 100%; }
      #enrollmentsView .filter-chip { text-align: center; width: auto; margin: 0; }
      
      /* Course Filter Controls */
      #coursesView div[style*="justify-content:space-between"] {
        flex-direction: column;
        align-items: stretch !important;
      }
      #coursesView div[style*="justify-content:space-between"] .section-title {
        margin-bottom: 8px;
      }
      #coursesView div[style*="justify-content:space-between"] div[style*="display:flex"] {
        flex-direction: column;
        align-items: stretch !important;
        width: 100%;
        gap: 8px;
      }
      #coursesView div[style*="justify-content:space-between"] input,
      #coursesView div[style*="justify-content:space-between"] select {
        width: 100% !important;
      }
      
      /* Image proofs stack on mobile */
      .req-images { flex-direction: column; align-items: center; }
      .req-img-box { width: 100%; }
      .req-img-box img, .no-img-placeholder { max-width: 100%; width: 100%; height: 160px; }
      
      /* Form Layouts stack */
      #courseForm div[style*="display:grid"] {
        grid-template-columns: 1fr !important;
      }
      #courseForm div[style*="display:flex"] {
        flex-direction: column;
        width: 100%;
      }
      #courseForm button {
        width: 100% !important;
      }
    }
  </style>
</head>
<body>
<div class="dashboard-page">

  <!-- TOP BAR -->
  <header class="topbar">
    <div class="topbar-left">
      <div class="auth-logo" style="margin:0; text-decoration:none; display:flex; align-items:center; gap:10px;">
        <div class="logo-icon">🛡️</div>
        <span class="logo-text">IMPLEXEDU Admin</span>
      </div>
    </div>
    <div class="topbar-right">
      <span class="role-tag" style="background:rgba(244,63,94,0.12);color:#fb7185;border:1px solid rgba(244,63,94,0.3);">Admin</span>
      <div class="user-chip">
        <div class="user-avatar" id="adminInitial">?</div>
        <span class="user-name" id="adminName">Loading…</span>
      </div>
      <button class="btn-logout" id="logoutBtn">Sign Out</button>
    </div>
  </header>

  <!-- MAIN -->
  <main class="main">
    <div class="page-header" style="display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:16px;">
      <div>
        <h1 class="page-title" id="pageTitle">Enrollment Requests</h1>
        <p class="page-subtitle" id="pageSubtitle">Review student payment proofs and approve or reject enrollment requests.</p>
      </div>
      <!-- Tab Navigation -->
      <div class="filter-bar" style="margin-bottom:0; gap:8px;">
        <button class="filter-chip active" id="tabEnrollments" style="border-radius:8px; font-weight:700;">📋 Enrollments</button>
        <button class="filter-chip" id="tabCourses" style="border-radius:8px; font-weight:700;">🎓 Courses</button>
      </div>
    </div>

    <div class="alert alert-error" id="dashAlert" style="display:none;margin-bottom:24px;"><span>⚠️</span><span id="dashAlertMsg"></span></div>
    <div class="alert alert-success" id="dashSuccess" style="display:none;margin-bottom:24px;"><span>✅</span><span id="dashSuccessMsg"></span></div>

    <!-- Enrollments View -->
    <div id="enrollmentsView">
      <div class="filter-bar" id="filterBar" style="margin-bottom:20px;">
        <button class="filter-chip active" data-status="all">All</button>
        <button class="filter-chip" data-status="Pending">⏳ Pending</button>
        <button class="filter-chip" data-status="Approved">✅ Approved</button>
        <button class="filter-chip" data-status="Rejected">❌ Rejected</button>
      </div>

      <div class="req-grid" id="reqGrid">
        <div class="empty-state"><div class="loading-spinner" style="width:32px;height:32px;margin:0 auto 16px;border-width:3px"></div><p>Loading enrollment requests…</p></div>
      </div>
    </div>

    <!-- Courses View -->
    <div id="coursesView" style="display:none;">
      <!-- Create/Edit Course Form -->
      <div style="background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:24px 28px; margin-bottom:32px; text-align:left;">
        <h2 class="section-title" style="font-family:var(--font-head); font-size:16px; font-weight:800; margin-bottom:4px; color:var(--text);" id="courseFormTitle">🎓 Add New Course</h2>
        <p style="font-size:11px; color:var(--text-muted); margin-bottom:20px;">Fill in the details below to create or update a course.</p>

        <form id="courseForm" novalidate style="display:flex; flex-direction:column; gap:16px;">
          <input type="hidden" id="courseMongoId" />
          <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:14px;">
            <div>
              <label class="form-label" for="courseId">Course ID</label>
              <input class="form-input" type="text" id="courseId" placeholder="e.g. neet-prep" required style="width:100%; box-sizing:border-box;" />
            </div>
            <div>
              <label class="form-label" for="courseName">Course Name</label>
              <input class="form-input" type="text" id="courseName" placeholder="e.g. NEET Preparation" required style="width:100%; box-sizing:border-box;" />
            </div>
            <div>
              <label class="form-label" for="courseTrack">Track (Medium)</label>
              <input class="form-input" type="text" id="courseTrack" placeholder="e.g. English Medium" required style="width:100%; box-sizing:border-box;" />
            </div>
            <div>
              <label class="form-label" for="courseLevel">Level</label>
              <input class="form-input" type="text" id="courseLevel" placeholder="e.g. Competitive" required style="width:100%; box-sizing:border-box;" />
            </div>
            <div>
              <label class="form-label" for="courseFee">Fee (₹)</label>
              <input class="form-input" type="number" id="courseFee" placeholder="25000" required min="0" style="width:100%; box-sizing:border-box;" />
            </div>
            <div>
              <label class="form-label" for="courseIsActive">Status</label>
              <select class="form-input" id="courseIsActive" style="width:100%; box-sizing:border-box;">
                <option value="true">Active</option>
                <option value="false">Inactive</option>
              </select>
            </div>
          </div>
          <div style="display:flex; gap:12px; justify-content:flex-start;">
            <button type="submit" class="btn-approve" id="courseBtn" style="flex:none; width:auto; padding:10px 24px;">Save Course</button>
            <button type="button" class="btn-ignore" id="courseResetBtn" style="flex:none; width:auto; padding:10px 20px;">Reset</button>
          </div>
        </form>
      </div>

      <!-- Course List -->
      <div style="text-align:left;">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px; margin-bottom:20px; border-bottom:1px solid var(--border); padding-bottom:16px;">
          <h2 class="section-title" style="font-family:var(--font-head); font-size:16px; font-weight:800; margin-bottom:0; color:var(--text);">All Courses (<span id="coursesCount">0</span>)</h2>
          
          <!-- Filters & Search -->
          <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:center;">
            <input type="text" id="courseSearch" placeholder="🔍 Search name or ID..." style="background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:8px 14px; font-size:12px; color:var(--text); width:180px; box-sizing:border-box;" />
            
            <select id="filterLevel" style="background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:8px 12px; font-size:12px; color:var(--text); cursor:pointer;">
              <option value="all">All Categories</option>
              <option value="school">School (5–10)</option>
              <option value="higher">Class 11–12</option>
              <option value="university">University</option>
              <option value="competitive">Competitive</option>
              <option value="professional">Professional</option>
            </select>
            
            <select id="filterStatus" style="background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:8px 12px; font-size:12px; color:var(--text); cursor:pointer;">
              <option value="all">All Statuses</option>
              <option value="active">Active Only</option>
              <option value="inactive">Inactive Only</option>
            </select>
          </div>
        </div>
        <div class="req-grid" id="coursesGrid">
          <div class="empty-state"><p>Loading courses…</p></div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="this.classList.remove('open')">
  <img id="lightboxImg" src="" alt="Preview" />
</div>

<script>
/* ══════════════════════════════════════════════
   ADMIN AUTH (completely separate from student/teacher auth)
══════════════════════════════════════════════ */
const adminToken = localStorage.getItem('admin_token');
const adminUser  = JSON.parse(localStorage.getItem('admin_user') || 'null');
if (!adminToken || !adminUser) { window.location.href = 'admin-login.html'; }

document.getElementById('adminName').textContent = adminUser ? adminUser.name : '';
document.getElementById('adminInitial').textContent = adminUser ? adminUser.name.charAt(0).toUpperCase() : '?';

document.getElementById('logoutBtn').addEventListener('click', () => {
  localStorage.removeItem('admin_token');
  localStorage.removeItem('admin_user');
  window.location.href = 'admin-login.html';
});

const adminHeaders = { 'Content-Type': 'application/json', Authorization: `Bearer ${adminToken}` };

function escHtml(str) {
  return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showDashAlert(msg, type = 'error') {
  const boxId = type === 'success' ? 'dashSuccess' : 'dashAlert';
  const msgId = type === 'success' ? 'dashSuccessMsg' : 'dashAlertMsg';
  document.getElementById(msgId).textContent = msg;
  document.getElementById(boxId).style.display = 'flex';
  window.scrollTo({ top: 0, behavior: 'smooth' });
  setTimeout(() => { document.getElementById(boxId).style.display = 'none'; }, 6000);
}

function openLightbox(src) {
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').classList.add('open');
}

/* ══════════════════════════════════════════════
   LOAD + RENDER ENROLLMENT REQUESTS
══════════════════════════════════════════════ */
let allRequests = [];
let activeStatus = 'all';

async function loadRequests() {
  try {
    const res = await fetch('/api/admin/enrollments', { headers: adminHeaders });
    if (res.status === 401 || res.status === 403) {
      localStorage.removeItem('admin_token');
      localStorage.removeItem('admin_user');
      window.location.href = 'admin-login.html';
      return;
    }
    const data = await res.json();
    allRequests = data.enrollments || [];
    renderRequests();
  } catch {
    document.getElementById('reqGrid').innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-title">Could not load requests</div><p>Check your connection and refresh.</p></div>`;
  }
}

function renderRequests() {
  const grid = document.getElementById('reqGrid');
  const filtered = activeStatus === 'all' ? allRequests : allRequests.filter(r => r.status === activeStatus);

  if (!filtered.length) {
    grid.innerHTML = `<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-title">No requests found</div><p>Nothing matches this filter yet.</p></div>`;
    return;
  }

  grid.innerHTML = filtered.map(r => {
    const sd = r.studentDetails || {};
    const submitted = new Date(r.createdAt).toLocaleString('en-IN', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
    const disabled = r.status !== 'Pending';

    return `
      <div class="req-card req-status-${r.status}">
        <div class="req-status-strip"></div>

        <div class="req-top">
          <div>
            <div class="req-course">${escHtml(r.courseName)}</div>
            <div class="req-meta">${escHtml(r.track)} · ${escHtml(r.level)}</div>
          </div>
          <div>
            <div class="req-fee">₹${Number(r.fee).toLocaleString('en-IN')}</div>
            <span class="status-badge status-${r.status}">${r.status}</span>
          </div>
        </div>

        <div class="req-fields">
          <div><div class="req-field-label">Student Name</div><div class="req-field-val">${escHtml(sd.fullName || (r.userId && r.userId.name) || '—')}</div></div>
          <div><div class="req-field-label">Email</div><div class="req-field-val">${escHtml(sd.email || (r.userId && r.userId.email) || '—')}</div></div>
          <div><div class="req-field-label">Phone</div><div class="req-field-val">${escHtml(sd.mobile || '—')}</div></div>
          <div><div class="req-field-label">UTR Number</div><div class="req-field-val">${escHtml(r.utrNumber || '—')}</div></div>
          <div style="grid-column:1/-1;"><div class="req-field-label">Submitted On</div><div class="req-field-val">${escHtml(submitted)}</div></div>
        </div>

        <div class="req-images">
          <div class="req-img-box">
            ${r.passportPhoto ? `
              <img src="${r.passportPhoto}" alt="Passport Photo" onclick="openLightbox('${r.passportPhoto}')" />
            ` : `
              <div class="no-img-placeholder">⚠️ No Photo</div>
            `}
            <div class="req-img-label">Passport Photo</div>
          </div>
          <div class="req-img-box">
            ${r.paymentScreenshot ? `
              <img src="${r.paymentScreenshot}" alt="Payment Screenshot" onclick="openLightbox('${r.paymentScreenshot}')" />
            ` : `
              <div class="no-img-placeholder">⚠️ No Screenshot</div>
            `}
            <div class="req-img-label">Payment Screenshot</div>
          </div>
        </div>

        <div class="req-actions">
          ${r.status === 'Pending' ? `
            <button class="btn-approve" onclick="updateStatus('${r._id}', 'Approved')">✅ Approve</button>
            <button class="btn-reject" onclick="updateStatus('${r._id}', 'Rejected')">❌ Reject</button>
            <button class="btn-ignore" onclick="ignoreRequest()">🙈 Ignore</button>
          ` : `
            <button class="btn-undo" onclick="updateStatus('${r._id}', 'Pending')">🔄 Undo Action</button>
          `}
        </div>
      </div>
    `;
  }).join('');
}

// "Ignore" makes no status change at all — request stays Pending.
function ignoreRequest() {
  showDashAlert('Request left unchanged — status remains Pending.', 'success');
}

async function updateStatus(id, status) {
  try {
    const res = await fetch(`/api/admin/enrollments/${id}/status`, {
      method: 'PUT',
      headers: adminHeaders,
      body: JSON.stringify({ status }),
    });
    const data = await res.json();
    if (!res.ok || !data.success) throw new Error(data.message || 'Could not update status.');

    showDashAlert(`Enrollment marked as ${status}.`, 'success');
    await loadRequests();
  } catch (err) {
    showDashAlert(err.message);
  }
}

document.getElementById('filterBar').addEventListener('click', e => {
  const chip = e.target.closest('.filter-chip');
  if (!chip) return;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  activeStatus = chip.dataset.status;
  renderRequests();
});

/* ══════════════════════════════════════════════
   TAB SWITCHING LOGIC
══════════════════════════════════════════════ */
const tabEnrollments = document.getElementById('tabEnrollments');
const tabCourses = document.getElementById('tabCourses');
const enrollmentsView = document.getElementById('enrollmentsView');
const coursesView = document.getElementById('coursesView');
const pageTitle = document.getElementById('pageTitle');
const pageSubtitle = document.getElementById('pageSubtitle');

tabEnrollments.addEventListener('click', () => {
  tabEnrollments.classList.add('active');
  tabCourses.classList.remove('active');
  enrollmentsView.style.display = 'block';
  coursesView.style.display = 'none';
  pageTitle.textContent = 'Enrollment Requests';
  pageSubtitle.textContent = 'Review student payment proofs and approve or reject enrollment requests.';
  hideAlerts();
});

tabCourses.addEventListener('click', () => {
  tabCourses.classList.add('active');
  tabEnrollments.classList.remove('active');
  enrollmentsView.style.display = 'none';
  coursesView.style.display = 'block';
  pageTitle.textContent = 'Course Management';
  pageSubtitle.textContent = 'Add, edit, toggle, or delete academic courses offered to students.';
  hideAlerts();
  loadCourses();
});

function hideAlerts() {
  document.getElementById('dashAlert').style.display = 'none';
  document.getElementById('dashSuccess').style.display = 'none';
}

/* ══════════════════════════════════════════════
   COURSE MANAGEMENT LOGIC
══════════════════════════════════════════════ */
let allCourses = [];

async function loadCourses() {
  try {
    const res = await fetch('/api/courses/all', { headers: adminHeaders });
    if (res.status === 401 || res.status === 403) {
      localStorage.removeItem('admin_token');
      localStorage.removeItem('admin_user');
      window.location.href = 'admin-login.html';
      return;
    }
    const data = await res.json();
    allCourses = data.courses || [];
    renderCourses();
  } catch (err) {
    document.getElementById('coursesGrid').innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-title">Could not load courses</div><p>${err.message}</p></div>`;
  }
}

function renderCourses() {
  const grid = document.getElementById('coursesGrid');
  const searchVal = document.getElementById('courseSearch').value.toLowerCase().trim();
  const levelVal = document.getElementById('filterLevel').value;
  const statusVal = document.getElementById('filterStatus').value;

  const filtered = allCourses.filter(course => {
    const matchesSearch = !searchVal || 
      course.name.toLowerCase().includes(searchVal) || 
      course.courseId.toLowerCase().includes(searchVal);
      
    const matchesLevel = levelVal === 'all' || course.level.toLowerCase() === levelVal.toLowerCase();
    
    let matchesStatus = true;
    if (statusVal === 'active') matchesStatus = course.isActive;
    else if (statusVal === 'inactive') matchesStatus = !course.isActive;
    
    return matchesSearch && matchesLevel && matchesStatus;
  });

  document.getElementById('coursesCount').textContent = filtered.length;

  if (filtered.length === 0) {
    grid.innerHTML = `
      <div class="empty-state" style="grid-column: 1/-1;">
        <div class="empty-icon">🔍</div>
        <div class="empty-title">No courses found</div>
        <p>No courses match your current search or filter options.</p>
      </div>`;
    return;
  }

  grid.innerHTML = filtered.map(course => {
    const feeStr = Number(course.fee).toLocaleString('en-IN');
    return `
      <div class="req-card" style="border-top: 4px solid ${course.isActive ? 'var(--accent)' : 'var(--text-muted)'};">
        <div class="req-top">
          <div>
            <div class="req-course">${escHtml(course.name)}</div>
            <div class="req-meta">ID: ${escHtml(course.courseId)}</div>
          </div>
          <div>
            <div class="req-fee">₹${feeStr}</div>
            <span class="status-badge" style="background:${course.isActive ? 'rgba(34,197,94,0.12);color:#22c55e;' : 'rgba(100,116,139,0.12);color:#64748b;'}">
              ${course.isActive ? 'Active' : 'Inactive'}
            </span>
          </div>
        </div>
        <div class="req-fields" style="grid-template-columns: 1fr 1fr; margin-top: 12px; margin-bottom: 12px;">
          <div><div class="req-field-label">Track</div><div class="req-field-val">${escHtml(course.track)}</div></div>
          <div><div class="req-field-label">Level</div><div class="req-field-val">${escHtml(course.level)}</div></div>
        </div>
        <div class="req-actions" style="margin-top:12px; gap:8px;">
          <button class="btn-approve" style="padding:6px 12px; font-size:12px; width:auto; flex:1;" onclick="editCourse('${course._id}')">✏️ Edit</button>
          <button class="btn-undo" style="padding:6px 12px; font-size:12px; width:auto; flex:1; background:${course.isActive ? 'rgba(239,68,68,0.15)' : 'rgba(34,197,94,0.15)'}; color:${course.isActive ? '#ef4444' : '#22c55e'}; border-color:transparent;" onclick="toggleCourse('${course._id}', ${!course.isActive})">
            ${course.isActive ? '⏸️ Deactivate' : '▶️ Activate'}
          </button>
          <button class="btn-reject" style="padding:6px 12px; font-size:12px; width:auto; flex:none;" onclick="deleteCourse('${course._id}')">🗑️ Delete</button>
        </div>
      </div>
    `;
  }).join('');
}

document.getElementById('courseSearch').addEventListener('input', renderCourses);
document.getElementById('filterLevel').addEventListener('change', renderCourses);
document.getElementById('filterStatus').addEventListener('change', renderCourses);

document.getElementById('courseForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  hideAlerts();
  
  const mongoId = document.getElementById('courseMongoId').value.trim();
  const payload = {
    courseId: document.getElementById('courseId').value.trim(),
    name: document.getElementById('courseName').value.trim(),
    track: document.getElementById('courseTrack').value.trim(),
    level: document.getElementById('courseLevel').value.trim(),
    fee: Number(document.getElementById('courseFee').value),
    isActive: document.getElementById('courseIsActive').value === 'true',
  };

  if (!payload.courseId || !payload.name || !payload.track || !payload.level || Number.isNaN(payload.fee)) {
    showDashAlert('Please fill in all course fields.', 'error');
    return;
  }

  const btn = document.getElementById('courseBtn');
  btn.disabled = true;
  btn.textContent = 'Saving…';

  try {
    const url = mongoId ? `/api/courses/${mongoId}` : '/api/courses/create';
    const method = mongoId ? 'PUT' : 'POST';
    const res = await fetch(url, {
      method,
      headers: adminHeaders,
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || 'Failed to save course.');

    showDashAlert(mongoId ? 'Course updated successfully!' : 'Course created successfully!', 'success');
    resetCourseForm();
    await loadCourses();
  } catch (err) {
    showDashAlert(err.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Save Course';
  }
});

document.getElementById('courseResetBtn').addEventListener('click', () => {
  resetCourseForm();
});

function resetCourseForm() {
  document.getElementById('courseForm').reset();
  document.getElementById('courseMongoId').value = '';
  document.getElementById('courseFormTitle').textContent = '🎓 Add New Course';
  document.getElementById('courseId').disabled = false;
}

function editCourse(id) {
  const course = allCourses.find(c => c._id === id);
  if (!course) return;

  document.getElementById('courseMongoId').value = course._id;
  document.getElementById('courseId').value = course.courseId;
  document.getElementById('courseId').disabled = true; // Lock courseId on edit
  document.getElementById('courseName').value = course.name;
  document.getElementById('courseTrack').value = course.track;
  document.getElementById('courseLevel').value = course.level;
  document.getElementById('courseFee').value = course.fee;
  document.getElementById('courseIsActive').value = String(course.isActive);
  document.getElementById('courseFormTitle').textContent = '✏️ Edit Course';
  
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function toggleCourse(id, isActive) {
  try {
    const course = allCourses.find(c => c._id === id);
    if (!course) return;
    const res = await fetch(`/api/courses/${id}`, {
      method: 'PUT',
      headers: adminHeaders,
      body: JSON.stringify({
        name: course.name,
        track: course.track,
        level: course.level,
        fee: course.fee,
        isActive
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || 'Failed to update course status.');
    showDashAlert(`Course status updated to ${isActive ? 'Active' : 'Inactive'}.`, 'success');
    await loadCourses();
  } catch (err) {
    showDashAlert(err.message, 'error');
  }
}

async function deleteCourse(id) {
  if (!confirm('Are you sure you want to delete this course? This action cannot be undone.')) return;
  try {
    const res = await fetch(`/api/courses/${id}`, {
      method: 'DELETE',
      headers: adminHeaders
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || 'Failed to delete course.');
    showDashAlert('Course deleted successfully.', 'success');
    await loadCourses();
  } catch (err) {
    showDashAlert(err.message, 'error');
  }
}

loadRequests();
</script>
</body>
</html>
